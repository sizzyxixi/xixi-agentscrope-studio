[project]
name = "xixi-agentscope-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116", "uvicorn>=0.35", "pydantic>=2",
  "agentscope==2.0.4.post1", "qdrant-client>=1.15,<2",
  "cryptography>=44", "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20", "python-dotenv>=1,<2",
  "python-docx>=1.2,<2", "python-pptx>=1,<2", "openpyxl>=3.1,<4",
  "pypdf>=6,<7", "reportlab>=4,<6", "Pillow>=11,<14",
  "PyYAML>=6,<7", "beautifulsoup4>=4.13,<5", "defusedxml>=0.7,<1",
  "xlrd>=2,<3", "odfpy>=1.4,<2", "PyMuPDF>=1.26,<3",
  "markdown-it-py>=3,<5", "httpx>=0.28,<1",
  "rapidocr-onnxruntime==1.4.4", "opencv-python-headless>=4.10,<5"
]

# RapidOCR's wheel declares GUI OpenCV, but this server has no display/libGL.
# Keep its other dependencies and use the compatible headless distribution.
[[tool.uv.dependency-metadata]]
name = "rapidocr-onnxruntime"
version = "1.4.4"
requires-dist = [
  "pyclipper>=1.2.0", "opencv-python-headless>=4.10,<5",
  "numpy>=1.19.5,<3", "six>=1.15.0", "Shapely>=1.7.1,!=2.0.4",
  "PyYAML", "Pillow", "onnxruntime>=1.7.0", "tqdm"
]

[tool.vercel]
entrypoint = "api_backend:app"
